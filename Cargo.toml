[package]
name = "rs-paint"
version = "1.0.0"
edition = "2021"
description = "A lightweight MS Paint clone built with Rust + egui"

[[bin]]
name = "rs-paint"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
arboard = { version = "3", features = ["image-data"] }

# Generating the multi-resolution .ico (used by the example) and embedding it
# into the Windows .exe so Explorer shows a file icon.
[dev-dependencies]
ico = "0.3"

[build-dependencies]
winresource = "0.1"

# Native pasteboard access so Cmd+V can carry both an image and a text marker
# (egui/winit only forwards Cmd+V to the app when the clipboard holds text).
# Windows: set image + a text marker together so Ctrl+V is forwarded to the app
# (egui/winit only delivers Ctrl+V when the clipboard also holds text).
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }

# Smaller, faster release binary
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
